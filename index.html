<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Metronomo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Metronomo">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:dark;--p:#1b1b22;--b:#33333d}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#f2f2f5;font-family:-apple-system,system-ui,sans-serif;padding:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
.wrap{display:grid;grid-template-columns:1fr;gap:12px;max-width:1000px;margin:auto}
@media (min-width:760px){.wrap{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--p);border-radius:16px;padding:12px}
#stage{height:160px;position:relative;overflow:hidden}
@media (min-width:760px){#stage{height:240px}}
#dot{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#fff;opacity:.08;transform:scale(.6)}
#rn{text-align:center;font-size:20px;min-height:26px;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0}
button,select,input{font-size:17px;border:0;border-radius:10px;background:var(--b);color:inherit;padding:10px 12px}
button.main{background:#ff4d4d;font-weight:600;padding:12px 22px}
#bpm{font-size:40px;font-weight:700;width:150px;text-align:center}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff}
.vw{padding:8px 14px;font-size:15px}.vw.sel{outline:2px solid #fff}
#sc{width:100%}
#list{max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (min-width:760px){#list{max-height:calc(100vh - 300px);min-height:200px}}
.item{display:flex;gap:4px;align-items:center;margin:6px 0}
.item .nm{flex:1;text-align:left;background:var(--b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.on .nm{outline:2px solid #ff4d4d}
.item button{padding:8px 10px}
small{opacity:.6}
summary{font-size:16px;cursor:pointer}
textarea{width:100%;height:120px;margin-top:8px;border:0;border-radius:10px;background:#0f0f14;color:#ddd;font-size:12px;padding:8px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
#pop{background:var(--p);border-radius:18px;padding:16px;width:min(92vw,420px)}
#pop .big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pop .big button{padding:16px 0}
#upd{display:none;position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;background:#ff9f1a;color:#000;border-radius:12px;padding:12px;text-align:center;font-weight:600}
</style></head><body>
<div id="upd">Aggiornamento pronto: tocca per ricaricare</div>
<div class="wrap">
 <div class="col">
  <div class="card" id="stage"><div id="dot"></div></div>
  <div id="rn"></div>
  <div class="card" style="margin-top:12px">
   <div class="row" id="sws"></div>
   <div class="row" id="vws"></div>
   <div class="row"><input id="bpm" type="number" step="0.01" min="20" max="300" inputmode="decimal"><button class="main" id="go">Start</button></div>
   <div class="row"><small>BPM</small></div>
   <div class="row"><button id="fine">Regolazioni fini</button><button id="snd">🔇 Audio off</button><button id="dbgb">Debug off</button></div>
   <div class="row"><small id="dg" style="display:none"></small></div>
  </div>
 </div>
 <div class="col">
  <div class="card">
   <select id="sc"></select>
   <div class="row"><button id="scNew">Nuovo</button><button id="scRen">Rinomina</button><button id="scDup">Duplica</button><button id="scDel">Elimina</button></div>
   <div id="list"></div>
   <div class="row"><button id="add">+ Aggiungi ritmo (BPM attuale)</button></div>
  </div>
  <details class="card" style="margin-top:12px"><summary>↔ Trasferisci elenco (esporta / importa)</summary>
   <textarea id="xfer" placeholder="Qui compare l'elenco esportato"></textarea>
   <div class="row"><button id="xout">Mostra / copia elenco</button><button id="xin">Importa (nuovo evento)</button></div>
   <small id="xmsg"></small>
  </details>
 </div>
</div>
<div id="ov"><div id="pop">
  <div class="row"><b id="pbpm" style="font-size:34px"></b></div>
  <div class="big">
    <button data-d="-1">−1</button><button data-d="-0.1">−0,1</button><button data-d="-0.01">−0,01</button>
    <button data-d="1">+1</button><button data-d="0.1">+0,1</button><button data-d="0.01">+0,01</button>
  </div>
  <div class="row"><button id="tap">Tap tempo</button><button class="main" id="pclose">Chiudi</button></div>
</div></div>
<script>
const $ = id => document.getElementById(id);
const ls = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const ss = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// ---- Modello del battito (tutto locale: nessun server) ----
const M = { bpm: 100, run: false, aB: 0, aT: 0, name: '' };
const now = () => Date.now();
const beatPos = t => M.aB + (t - M.aT) * M.bpm / 60000;
const pulse = t => { if (!M.run) return 0; const p = beatPos(t); if (p < 0) return 0; return Math.exp(-6 * (p % 1)); };

// ---- Colore e vista (1 pallino / 4 pallini) ----
const PALETTE = ['#ffffff', '#ff4d4d', '#ff9f1a', '#ffd60a', '#32d74b', '#40c8e0', '#3b82f6', '#bf5af2'];
let COL = ls('metro_col', PALETTE[0]);
let VIEW = ls('metro_view', '1') === '4' ? '4' : '1';
function swatches(box) {
  box.innerHTML = '';
  PALETTE.forEach(c => {
    const b = document.createElement('button'); b.className = 'sw' + (c === COL ? ' sel' : ''); b.style.background = c;
    b.setAttribute('aria-label', 'Colore ' + c);
    b.onclick = () => { COL = c; ss('metro_col', c); swatches(box); };
    box.appendChild(b);
  });
}
function viewPicker(box) {
  box.innerHTML = '';
  [['1', '1 pallino'], ['4', '4 pallini']].forEach(o => {
    const b = document.createElement('button'); b.textContent = o[1]; b.className = 'vw' + (VIEW === o[0] ? ' sel' : '');
    b.onclick = () => { VIEW = o[0]; ss('metro_view', VIEW); viewPicker(box); };
    box.appendChild(b);
  });
}
let FRAMES = 0;
const _dots = new WeakMap();
function _ensure(host, n) {
  let st = _dots.get(host);
  if (st && st.n === n) return st;
  Array.prototype.slice.call(host.children).forEach(c => { if (c.dataset && c.dataset.d) host.removeChild(c); });
  const wrap = document.createElement('div'); wrap.dataset.d = '1';
  wrap.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:4%;';
  const els = [];
  for (let i = 0; i < n; i++) { const e = document.createElement('div'); e.style.cssText = 'border-radius:50%;flex:0 0 auto;will-change:transform,opacity;'; wrap.appendChild(e); els.push(e); }
  host.appendChild(wrap); st = { n: n, els: els }; _dots.set(host, st); return st;
}
function draw() {
  FRAMES++;
  const dot = $('dot'), host = $('stage'), t = now(), k = pulse(t);
  if (VIEW !== '4') {
    const st = _dots.get(host); if (st) st.els.forEach(e => { e.style.opacity = 0; });
    dot.style.display = 'block'; dot.style.background = COL;
    dot.style.opacity = (0.08 + 0.92 * k).toFixed(3); dot.style.transform = 'scale(' + (0.6 + 0.4 * k).toFixed(3) + ')';
    return;
  }
  dot.style.display = 'none';
  const st = _ensure(host, 4);
  const w = host.clientWidth || host.getBoundingClientRect().width, h = host.clientHeight || host.getBoundingClientRect().height;
  const d = Math.max(10, Math.min(w * 0.21, h * 0.9));
  let idx = -1; if (M.run) { const p = beatPos(t); if (p >= 0) idx = Math.floor(p) % 4; }
  st.els.forEach((e, i) => {
    e.style.width = e.style.height = d + 'px'; e.style.background = COL;
    const on = i === idx;
    e.style.opacity = on ? (0.35 + 0.65 * k).toFixed(3) : '0.12';
    e.style.transform = 'scale(' + (on ? (0.8 + 0.2 * k) : 0.8).toFixed(3) + ')';
  });
}
(function f() { draw(); requestAnimationFrame(f); })();

// ---- Click sonoro, programmato in anticipo sull'orologio audio ----
let AC = null, lastAT = 0, SOUND = ls('metro_snd', '0') === '1';
function audioInit() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
  if (AC.state !== 'running') AC.resume();
}
function click(when) {
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 1000;
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(0.8, when + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
  o.connect(g); g.connect(AC.destination); o.start(when); o.stop(when + 0.07);
}
setInterval(() => {
  if (!SOUND || !AC || AC.state !== 'running' || !M.run) return;
  const t = now(), pos = beatPos(t), posA = beatPos(t + 200);
  for (let n = Math.max(0, Math.ceil(pos)); n <= Math.floor(posA); n++) {
    const tn = M.aT + (n - M.aB) * 60000 / M.bpm, at = AC.currentTime + (tn - t) / 1000;
    if (at > lastAT + 0.02 && at >= AC.currentTime - 0.005) { click(Math.max(at, AC.currentTime)); lastAT = at; }
  }
}, 25);
document.addEventListener('click', () => { if (SOUND) audioInit(); }, true);
const showSnd = () => $('snd').textContent = SOUND ? '🔊 Audio on' : '🔇 Audio off';
$('snd').onclick = () => { SOUND = !SOUND; ss('metro_snd', SOUND ? '1' : '0'); if (SOUND) audioInit(); showSnd(); };
showSnd();

let WL = null, NS = null, NSERR = '', LASTHID = 0, HID_AT = 0;
function startVideo() {
  try {
    if (!NS) {
      NS = document.createElement('video');
      NS.setAttribute('playsinline', ''); NS.setAttribute('webkit-playsinline', ''); NS.loop = false; NS.muted = false;
      NS.style.cssText = 'position:fixed;left:0;bottom:0;width:96px;height:96px;border-radius:8px;pointer-events:none;z-index:1';
      NS.addEventListener('ended', () => { NS && NS.play().catch(e => { NSERR = (e && e.name) || 'errore'; }); });
      NS.addEventListener('pause', () => { setTimeout(() => { if (NS && !NS.ended && NS.paused && !document.hidden) NS.play().catch(() => {}); }, 80); });
      NS.src = NOSLEEP; document.body.appendChild(NS);
    }
    if (NS.paused) { const p = NS.play(); if (p && p.catch) p.catch(e => { NSERR = (e && e.name) || 'errore'; }); }
  } catch (e) { NSERR = (e && e.name) || 'errore'; }
}
function stopVideo() { if (NS) { try { NS.pause(); } catch (e) {} NS.removeAttribute('src'); NS.load(); NS.remove(); NS = null; } }
async function keepAwake() {
  startVideo(); // dentro il gesto dell'utente; se il Wake Lock funziona, il video viene tolto subito dopo
  try {
    if (navigator.wakeLock && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); }
  } catch (e) { WL = null; }
  if (WL) stopVideo();
}
const awakeOk = () => !!WL || (NS && !NS.paused);
['click', 'touchend'].forEach(ev => document.addEventListener(ev, () => { if (!awakeOk()) keepAwake(); }, true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { HID_AT = Date.now(); return; }
  if (HID_AT) { LASTHID = (Date.now() - HID_AT) / 1000; HID_AT = 0; }
  if (SOUND && AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }
  if (NS || !WL) keepAwake();

setInterval(() => { if (NS && NS.paused && !document.hidden) NS.play().catch(() => {}); }, 3000);
let DBG = ls('metro_dbg', '0') === '1';

  return (navigator.wakeLock ? (WL ? 'WakeLock sì' : 'WakeLock no') : 'WakeLock non disponibile') + ' · video ' + (NS && !NS.paused ? 'sì ' + NS.currentTime.toFixed(0) + 's' : 'no' + (NSERR ? ' (' + NSERR + ')' : ''))

function setBpm(v) {
  v = Math.max(20, Math.min(300, Math.round(v * 100) / 100));

// ---- Eventi e ritmi (salvati su questo dispositivo) ----
let db; try { db = JSON.parse(ls('metro_solo_db', 'null')); } catch (e) { db = null; }
if (!db || !Array.isArray(db.sc) || !db.sc.length) db = { cur: 0, sc: [{ n: 'Evento 1', r: [] }] };
const save = () => ss('metro_solo_db', JSON.stringify(db));
const cur = () => db.sc[db.cur];
function renderSc() {
  $('sc').innerHTML = ''; db.sc.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.n; $('sc').appendChild(o); });
  $('sc').value = db.cur; renderList();
}
function showActive() { document.querySelectorAll('.item').forEach(el => el.classList.toggle('on', +el.dataset.b === M.bpm)); }
function renderList() {
  const L = $('list'); L.innerHTML = '';
  cur().r.forEach((x, i) => {
    const d = document.createElement('div'); d.className = 'item'; d.dataset.b = x.b;
    const mk = (t, f, c) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; if (c) b.className = c; return b; };
    d.appendChild(mk(x.n + ' · ' + x.b, () => { M.name = x.n; setBpm(x.b); }, 'nm'));
    d.appendChild(mk('▲', () => { if (i > 0) { [cur().r[i - 1], cur().r[i]] = [cur().r[i], cur().r[i - 1]]; save(); renderList(); } }));
    d.appendChild(mk('▼', () => { if (i < cur().r.length - 1) { [cur().r[i + 1], cur().r[i]] = [cur().r[i], cur().r[i + 1]]; save(); renderList(); } }));
    d.appendChild(mk('✎', () => { const n = prompt('Nome ritmo', x.n); if (n) { x.n = n; save(); renderList(); } }));
    d.appendChild(mk('⟳', () => { x.b = M.bpm; save(); renderList(); }));
    d.appendChild(mk('🗑', () => { if (confirm('Eliminare "' + x.n + '"?')) { cur().r.splice(i, 1); save(); renderList(); } }));
    L.appendChild(d);
  });
  showActive();
}
$('sc').onchange = e => { db.cur = +e.target.value; save(); renderList(); };
$('scNew').onclick = () => { const n = prompt('Nome del nuovo evento', 'Evento ' + (db.sc.length + 1)); if (n) { db.sc.push({ n, r: [] }); db.cur = db.sc.length - 1; save(); renderSc(); } };
$('scRen').onclick = () => { const n = prompt('Nome evento', cur().n); if (n) { cur().n = n; save(); renderSc(); } };
$('scDup').onclick = () => { const n = prompt('Nome della copia', cur().n + ' (copia)'); if (n) { db.sc.push({ n, r: JSON.parse(JSON.stringify(cur().r)) }); db.cur = db.sc.length - 1; save(); renderSc(); } };
$('scDel').onclick = () => { if (db.sc.length > 1 && confirm('Eliminare l\'evento "' + cur().n + '"?')) { db.sc.splice(db.cur, 1); db.cur = 0; save(); renderSc(); } };
$('add').onclick = () => { const n = prompt('Nome del ritmo', 'Ritmo ' + (cur().r.length + 1)); if (n) { cur().r.push({ n, b: M.bpm }); save(); renderList(); } };

// ---- Esporta / importa (stesso formato del server sul portatile) ----
$('xout').onclick = () => {
  const ta = $('xfer'); ta.value = JSON.stringify(db); ta.focus(); ta.select(); ta.setSelectionRange(0, 9999999);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).then(() => { $('xmsg').textContent = 'Copiato'; }).catch(() => {}); }
  $('xmsg').textContent = ok ? 'Copiato negli appunti' : 'Elenco mostrato: seleziona il testo e copialo';
};
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function importStamp() { const d = new Date(); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
// Importazione NON distruttiva: crea uno o più eventi nuovi, quelli esistenti restano intatti
function importText(text) {
  const d = JSON.parse(text);
  if (!d || !Array.isArray(d.sc) || !d.sc.length) throw 0;
  d.sc.forEach(e => { if (typeof e.n !== 'string' || !Array.isArray(e.r)) throw 0; e.r.forEach(x => { if (typeof x.n !== 'string' || typeof x.b !== 'number') throw 0; }); });
  const base = 'Importazione ' + importStamp(), first = db.sc.length; let rh = 0;
  d.sc.forEach(e => { db.sc.push({ n: d.sc.length === 1 ? base : base + ' · ' + e.n, r: JSON.parse(JSON.stringify(e.r)) }); rh += e.r.length; });
  db.cur = first; save(); renderSc();
  return { n: d.sc.length, rh: rh, name: db.sc[first].n };
}
function importDone(r) { $('xmsg').textContent = r.n === 1 ? 'Creato l’evento «' + r.name + '» con ' + r.rh + ' ritmi' : 'Creati ' + r.n + ' eventi «Importazione …» con ' + r.rh + ' ritmi in totale'; }
function openImportModal() {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:10001;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px';
  const canPaste = !!(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext);
  ov.innerHTML = '<div style="background:#1b1b22;color:#f2f2f5;border-radius:18px;padding:16px;max-width:460px;width:100%;font-family:-apple-system,system-ui,sans-serif">'
    + '<b style="font-size:19px">Importa elenco</b>'
    + '<p style="font-size:15px;line-height:1.4;margin:8px 0">Verrà creato un <b>nuovo evento</b> «Importazione …». Gli eventi che hai già non vengono toccati.</p>'
    + (canPaste ? '<button id="impPaste" style="width:100%;margin-bottom:8px">📋 Incolla dagli appunti</button>' : '')
    + '<textarea id="impText" placeholder="Incolla qui l’elenco copiato (tieni premuto e scegli Incolla)" style="width:100%;height:110px;border:0;border-radius:10px;background:#0f0f14;color:#ddd;font-size:13px;padding:8px"></textarea>'
    + '<div id="impMsg" style="font-size:14px;min-height:20px;margin:6px 0;color:#ff9f1a"></div>'
    + '<div style="display:flex;gap:8px"><button id="impGo" class="main" style="flex:1">Importa</button><button id="impNo" style="flex:1">Annulla</button></div></div>';
  document.body.appendChild(ov);
  const close = () => { if (ov.parentNode) document.body.removeChild(ov); };
  const msg = t => { ov.querySelector('#impMsg').textContent = t; };
  const attempt = t => { try { importDone(importText(t)); close(); } catch (e) { msg('Testo non valido: incolla l’elenco copiato con «Mostra / copia elenco».'); } };
  ov.querySelector('#impGo').onclick = () => attempt(ov.querySelector('#impText').value);
  ov.querySelector('#impNo').onclick = close;
  const pb = ov.querySelector('#impPaste');
  if (pb) pb.onclick = () => navigator.clipboard.readText().then(t => { ov.querySelector('#impText').value = t; attempt(t); }).catch(() => msg('Non riesco a leggere gli appunti: incolla a mano nel riquadro.'));
}
$('xin').onclick = () => {
  // 1) se il browser lo permette (pagine https) prova a leggere direttamente gli appunti; 2) altrimenti apre la finestra con il riquadro
  if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext) {
    navigator.clipboard.readText().then(t => { try { importDone(importText(t)); } catch (e) { openImportModal(); } }).catch(() => openImportModal());
  } else openImportModal();
};

// ---- Avviso all'apertura ----
function showNotice() {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:10000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = '<div style="background:#1b1b22;color:#f2f2f5;border-radius:18px;padding:20px;max-width:440px;width:100%;font-family:-apple-system,system-ui,sans-serif;font-size:18px;line-height:1.45">'
    + '<p style="margin:0 0 12px">Per l’uso corretto disabilitare <b>sempre</b> il risparmio energetico.</p>'
    + '<p style="margin:0 0 18px">Tocca il pulsante per tenere lo schermo acceso e attivare il suono.</p>'
    + '<button id="noticeOk" style="font-size:19px;font-weight:600;padding:12px 28px;border:0;border-radius:12px;background:#ff4d4d;color:#fff;width:100%">Ho capito</button></div>';
  document.body.appendChild(ov);
  ov.querySelector('#noticeOk').onclick = e => { e.stopPropagation(); document.body.removeChild(ov); keepAwake(); if (SOUND) audioInit(); };
}
window.addEventListener('load', showNotice);

// ---- Funzionamento offline e aggiornamenti ----
if ('serviceWorker' in navigator) {
  let wantReload = false, waiting = null;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) { waiting = nw; $('upd').style.display = 'block'; } });
    });
  }).catch(() => {});
  $('upd').onclick = () => { wantReload = true; if (waiting) waiting.postMessage('skip'); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload) location.reload(); });
}

// ---- Avvio ----
swatches($('sws')); viewPicker($('vws')); showBpm(); renderSc();
</script></body></html>
